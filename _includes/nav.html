<script>
    // Drop Bootstarp low-performance Navbar
    // Use customize navbar with high-quality material design animation
    // in high-perf jank-free CSS3 implementation
    var $body   = document.body;
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function(){
            $navbar.className = " ";
            // wait until animation end.
            setTimeout(function(){
                // prevent frequently toggle
                if($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            },400)
        },
        open: function(){
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    // Bind Event
    $toggle.addEventListener('click', function(e){
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        }else{
            __HuxNav__.open()
        }
    })

    /**
     * Since Fastclick is used to delegate 'touchstart' globally
     * to hack 300ms delay in iOS by performing a fake 'click',
     * Using 'e.stopPropagation' to stop 'touchstart' event from 
     * $toggle/$collapse will break global delegation.
     * 
     * Instead, we use a 'e.target' filter to prevent handler
     * added to document close HuxNav.  
     *
     * Also, we use 'click' instead of 'touchstart' as compromise
     */
    document.addEventListener('click', function(e){
        if(e.target == $toggle) return;
        if(e.target.className == 'icon-bar') return;
        __HuxNav__.close();
        // close dropdown if clicking outside
        var dd = document.getElementById('aboutDropdown');
        if (dd && !dd.contains(e.target)) {
            dd.classList.remove('open');
        }
    })

    function toggleAboutMenu(e) {
        e.stopPropagation();
        var dd = document.getElementById('aboutDropdown');
        dd.classList.toggle('open');
    }
</script>

/* Hide-on-scroll-down / show-on-scroll-up */
.navbar-custom {
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.navbar-custom.nav-hidden {
    transform: translateY(-100%);
    box-shadow: none !important;
}
</style>

<script>
(function() {
    var lastY = 0;
    var navbar = document.querySelector('.navbar-custom');
    if (!navbar) return;
    // Show navbar at top of page always
    window.addEventListener('scroll', function() {
        var y = window.scrollY || window.pageYOffset;
        if (y < 60) {
            // Near top: always show
            navbar.classList.remove('nav-hidden');
        } else if (y > lastY + 4) {
            // Scrolling down: hide
            navbar.classList.add('nav-hidden');
            // Also close mobile menu if open
            var nb = document.querySelector('#huxblog_navbar');
            if (nb && nb.className.indexOf('in') >= 0) {
                nb.className = ' ';
                var collapse = document.querySelector('.navbar-collapse');
                if (collapse) collapse.style.height = '0px';
            }
        } else if (y < lastY - 4) {
            // Scrolling up: show
            navbar.classList.remove('nav-hidden');
        }
        lastY = y;
    }, { passive: true });
})();
</script>
