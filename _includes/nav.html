<!-- Navigation -->
<nav class="navbar navbar-default navbar-custom navbar-fixed-top">
    <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header page-scroll">
            <button type="button" class="navbar-toggle">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div id="huxblog_navbar">
            <div class="navbar-collapse">
                <ul class="nav navbar-nav navbar-right">
                    {% for item in site.data.nav %}{% unless item.mobile_only %}
                    <li>
                        <a href="{{ site.baseurl }}{{ item.href }}">{{ item.nav_label | default: item.label }}</a>
                    </li>
                    {% endunless %}{% endfor %}
                    <li>
                        <a href="{{ site.baseurl }}/search/" title="搜索" style="padding: 6px 12px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </a>
                    </li>
                    <li class="nav-dropdown" id="aboutDropdown">
                        <a href="javascript:void(0)" onclick="toggleAboutMenu(event)">關於我們 <span class="caret"></span></a>
                        <ul class="nav-dropdown-menu">
                            <li><a href="{{ site.baseurl }}/tags/">關於我們</a></li>
                            <li><a href="{{ site.baseurl }}/about/">信仰告白</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
        <!-- /.navbar-collapse -->
    </div>
    <!-- /.container -->
</nav>
<script>
    var $body   = document.body;
    var $toggle = document.querySelector('.navbar-toggle');
    var $navbar = document.querySelector('#huxblog_navbar');
    var $collapse = document.querySelector('.navbar-collapse');

    var __HuxNav__ = {
        close: function(){
            $navbar.className = " ";
            setTimeout(function(){
                if($navbar.className.indexOf('in') < 0) {
                    $collapse.style.height = "0px"
                }
            },400)
        },
        open: function(){
            $collapse.style.height = "auto"
            $navbar.className += " in";
        }
    }

    $toggle.addEventListener('click', function(e){
        if ($navbar.className.indexOf('in') > 0) {
            __HuxNav__.close()
        }else{
            __HuxNav__.open()
        }
    })

    document.addEventListener('click', function(e){
        if(e.target == $toggle) return;
        if(e.target.className == 'icon-bar') return;
        __HuxNav__.close();
        var dd = document.getElementById('aboutDropdown');
        if (dd && !dd.contains(e.target)) {
            dd.classList.remove('open');
        }
    })

    function toggleAboutMenu(e) {
        e.stopPropagation();
        var dd = document.getElementById('aboutDropdown');
        dd.classList.toggle('open');
    }
</script>
<style>
.nav-dropdown { position: relative; }
.nav-dropdown > a .caret {
    display: inline-block;
    width: 0; height: 0;
    margin-left: 4px;
    vertical-align: middle;
    border-top: 4px solid;
    border-right: 4px solid transparent;
    border-left: 4px solid transparent;
}
.nav-dropdown-menu {
    display: none;
    position: absolute;
    right: 0;
    top: 100%;
    min-width: 140px;
    background: #fff;
    border: 1px solid rgba(0,0,0,0.15);
    border-radius: 4px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.175);
    padding: 5px 0;
    margin-top: 2px;
    z-index: 1000;
    list-style: none;
}
.nav-dropdown.open .nav-dropdown-menu { display: block; }
.nav-dropdown-menu li a {
    display: block;
    padding: 6px 18px;
    color: #333 !important;
    font-size: 14px;
    text-decoration: none !important;
    white-space: nowrap;
}
.nav-dropdown-menu li a:hover {
    background: #f5f5f5;
    color: #0085a1 !important;
}


/* Mobile: static navbar at top only, scrolls away with page */
@media only screen and (max-width: 1169px) {
    .navbar-custom {
        position: absolute !important;
        top: 0;
        background-color: transparent !important;
        border-bottom: none !important;
    }
    .navbar-custom.nav-hidden {
    .navbar-custom .navbar-brand,
    .navbar-custom .nav li a {
        color: rgba(255, 255, 255, 0.92) !important;
    }
    .navbar-custom .navbar-brand:hover,
    .navbar-custom .nav li a:hover {
        color: #C9922A !important;
    }
    .navbar-custom .icon-bar {
        background-color: rgba(255, 255, 255, 0.9);
    }
    .navbar-custom .navbar-collapse {
        background-color: rgba(22, 22, 22, 0.98);
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    }
    .navbar-custom .nav > li > a {
        color: rgba(255, 255, 255, 0.88) !important;
        padding: 11px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .navbar-custom .nav > li:last-child > a {
        border-bottom: none;
    }
    .navbar-custom .nav > li > a:hover,
    .navbar-custom .nav > li > a:focus {
        color: #C9922A !important;
        background-color: rgba(255, 255, 255, 0.05) !important;
    }
}
</style>
