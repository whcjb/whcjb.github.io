<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai&display=swap" rel="stylesheet">

<style>
.creeds-header {
  background: linear-gradient(135deg, #3a1e00 0%, #7a4000 100%);
  color: #fff;
  padding: 56px 0 48px;
  text-align: center;
}
.creeds-header-label {
  font-size: 12px; letter-spacing: .18em; color: #e8c87a;
  text-transform: uppercase; margin-bottom: 14px;
}
.creeds-header-title {
  font-size: 30px; font-weight: bold;
  font-family: 'LXGW WenKai', 'STKaiti', serif;
  color: #fff; letter-spacing: 0.06em; margin-bottom: 8px;
}
.creeds-header-subtitle {
  font-size: 14px; color: rgba(255,255,255,0.6); letter-spacing: .06em;
}

.creeds-body {
  max-width: 820px; margin: 0 auto; padding: 44px 16px 64px;
}

.creeds-section { margin-bottom: 44px; }
.creeds-section:last-child { margin-bottom: 0; }

.creeds-section-label {
  font-size: 11px; font-weight: bold; color: #C9922A;
  letter-spacing: .18em; text-transform: uppercase;
  margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.creeds-section-label::after {
  content: ''; flex: 1; height: 1px; background: #f0e8d8;
}

.creed-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.creed-card {
  display: block;
  padding: 22px 24px 24px;
  border-radius: 10px;
  background: #fffaf4;
  border: 1.5px solid #e8d9c0;
  text-decoration: none !important;
  color: inherit;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  position: relative;
  overflow: hidden;
}
.creed-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, #8B5E00, #C9922A);
  opacity: 0; transition: opacity .15s;
}
.creed-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 24px rgba(74,37,0,0.12);
  border-color: #C9922A;
}
.creed-card:hover::before { opacity: 1; }
.creed-card-label {
  font-size: 10px; color: #C9922A; font-weight: bold;
  letter-spacing: .14em; text-transform: uppercase;
  margin-bottom: 10px;
}
.creed-card-title {
  font-size: 20px; font-weight: bold; color: #3a1e00;
  font-family: 'LXGW WenKai', 'STKaiti', serif;
  letter-spacing: 0.04em; margin-bottom: 8px;
}
.creed-card-meta {
  font-size: 12px; color: #bbb; line-height: 1.8;
}
</style>

<div class="creeds-header">
  <div class="creeds-header-label">Reformed Confessions &amp; Catechisms</div>
  <div class="creeds-header-title">信经信条</div>
  <div class="creeds-header-subtitle">改革宗信仰告白与要理问答</div>
</div>

<div class="container">
  <div class="row">
    <div class="col-lg-10 col-lg-offset-1">
      <div class="creeds-body">

        <div class="creeds-section">
          <div class="creeds-section-label">信仰告白</div>
          <div class="creed-grid">
            <a href="{{ site.baseurl }}/creeds/wcf/" class="creed-card">
              <div class="creed-card-label">Westminster Confession of Faith</div>
              <div class="creed-card-title">威斯敏斯特信仰告白</div>
              <div class="creed-card-meta">西敏大会 · 1646 年<br>中英对照 · 共 33 章</div>
            </a>
          </div>
        </div>

        <div class="creeds-section">
          <div class="creeds-section-label">要理问答</div>
          <div class="creed-grid">
            <a href="{{ site.baseurl }}/creeds/dayaoli/" class="creed-card">
              <div class="creed-card-label">Westminster Larger Catechism</div>
              <div class="creed-card-title">大要理问答</div>
              <div class="creed-card-meta">西敏大会 · 1648 年<br>吕沛渊 译 · 共 196 问</div>
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
