<style>
.dayaoli-wrap { max-width: 720px; margin: 0 auto; padding: 36px 16px 60px; }

.dayaoli-meta {

.dayaoli-meta h2 {

}
.dayaoli-meta p {

.sec-grid {
    display: grid;

}
.sec-card {
    display: block;
    padding: 20px 22px 22px;

    background: #fffaf4;

    text-decoration: none !important;
    color: inherit;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative;
    overflow: hidden;
}
.sec-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #8B5E00, #C9922A);
    opacity: 0;
    transition: opacity .15s;
}
.sec-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(74,37,0,0.12);
    border-color: #C9922A;
}
.sec-card:hover::before { opacity: 1; }
.sec-num {

.sec-title {

.sec-range {
