---
layout: default
---
{%- comment -%}
  威廉·阿特索尔《腓利门书注释》书卷首页。配色与章节页同源（灰紫 #8e8cbd）。
{%- endcomment -%}

<div class="container attersoll-book" style="padding-top: 70px;">
  <div class="row">
    <div class="col-lg-9 col-lg-offset-1 col-md-10 col-md-offset-1">

      <div class="at-booklang">
        {% if page.zh %}{% if page.en_url %}<a href="{{ site.baseurl }}{{ page.en_url }}">English edition &rarr;</a>{% endif %}
        {% else %}{% if page.zh_url %}<a href="{{ site.baseurl }}{{ page.zh_url }}">中文版 &rarr;</a>{% endif %}{% endif %}
      </div>
      <div class="at-hero">
        <h1>{{ page.book_name }}</h1>
        <p class="at-hero-author">{{ page.author }}</p>
        <p class="at-hero-meta">{{ page.edition }}</p>
      </div>

      {{ content }}

    </div>
  </div>
</div>

<style>
.attersoll-book { --at-ink: #8e8cbd; --at-ink-dark: #565582; --at-rule: #e8e6f6; --at-paper: #f6f5fb; }
.attersoll-book .at-booklang { text-align: right; margin: 0 0 10px; font-size: 13px; font-family: Georgia, serif; }
.attersoll-book .at-booklang a { color: var(--at-ink); border: 1px solid var(--at-rule);
  border-radius: 4px; padding: 4px 10px; text-decoration: none; }
.attersoll-book .at-booklang a:hover { background: var(--at-ink); color: #fff; }
/* 书首：不用大色块横幅（用户 2026-10-22），书名 + 作者 + 版本一行起，下接细线 */
.attersoll-book .at-hero {
  margin: 4px 0 22px; padding: 0 0 12px; border-bottom: 2px solid var(--at-ink);
  font-family: Georgia, "Times New Roman", "Songti SC", serif;
}
.attersoll-book .at-hero h1 { font-family: Georgia, "Times New Roman", "Songti SC", serif; margin: 0 0 4px; font-size: 26px; font-weight: normal; line-height: 1.3; color: var(--at-ink-dark); }
.attersoll-book .at-hero-author { margin: 0; font-size: 14.5px; color: #3e4157; }
.attersoll-book .at-hero-meta { margin: 2px 0 0; font-size: 13px; color: #7e8199; font-style: italic; }
.attersoll-book .at-group {
  font-family: Georgia, "Times New Roman", "Songti SC", serif; margin: 30px 0 12px;
  font-size: 15px; color: var(--at-ink-dark); letter-spacing: .05em;
  padding-bottom: 6px; border-bottom: 1px solid var(--at-rule);
}
.attersoll-book .at-toc { list-style: none; padding: 0; margin: 0; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.attersoll-book .at-toc li { margin: 0; }
.attersoll-book .at-toc a { display: block; padding: 9px 13px; border: 1px solid var(--at-rule);
  border-radius: 4px; background: var(--at-paper); text-decoration: none;
  font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 15px; color: #262536; line-height: 1.45; }
.attersoll-book .at-toc a:hover { border-color: var(--at-ink); background: #fff; color: var(--at-ink-dark); }
.attersoll-book .at-toc small { display: block; color: #7e8199; font-size: 12.5px; }
.attersoll-book .at-chgrid { list-style: none; padding: 0; margin: 0; display: grid;
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.attersoll-book .at-chgrid a { display: block; text-align: center; padding: 10px 6px; border: 1px solid var(--at-rule);
  border-radius: 4px; background: var(--at-paper); text-decoration: none; color: #262536;
  font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 15px; }
.attersoll-book .at-chgrid a:hover { border-color: var(--at-ink); background: #fff; color: var(--at-ink-dark); }
.attersoll-book .at-note { font-family: Georgia, "Times New Roman", "Songti SC", serif; font-size: 13.5px;
  color: #63667f; line-height: 1.8; margin: 34px 0 0; padding-top: 16px; border-top: 1px solid var(--at-rule); }
.attersoll-book .at-note p { margin: 0 0 12px; }
.attersoll-book .at-note-zh { font-family: "Songti SC", STSong, serif; }
.attersoll-book .at-conj { color: #8a5a00; background: #fff6e0; border-radius: 2px; padding: 0 1px; font-style: normal; }
.attersoll-book .at-gap { color: #c0392b; background: #fdecea; border-radius: 2px; padding: 0 2px; }
.attersoll-book .at-conjhead { font-family: "Songti SC", STSong, Georgia, serif; font-size: 16px; color: var(--at-ink-dark); margin: 26px 0 10px; }
.attersoll-book .at-conjtab { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.6; margin: 10px 0 20px; }
.attersoll-book .at-conjtab th, .attersoll-book .at-conjtab td { border-bottom: 1px solid var(--at-rule); padding: 6px 6px; vertical-align: top; text-align: left; }
.attersoll-book .at-conjtab th { background: var(--at-paper); color: var(--at-ink-dark); white-space: nowrap; }
@media (max-width: 767px) {
  .attersoll-book .at-hero h1 { font-size: 22px; }
  .attersoll-book .at-toc { grid-template-columns: 1fr; }
  .attersoll-book .at-conjtab { display: block; overflow-x: auto; }
}
</style>
