---
layout: default
---

<div class="container" style="padding-top: 70px;">
  <div class="row">
    <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">

      <div style="margin: 16px 0 24px; font-size:13px;">
        <a href="{{ site.baseurl }}/owen/{{ page.book_id }}/">&larr; {{ page.book_name }}</a>
      </div>

      <div class="owen-content owen-book" data-book="{{ page.book_id }}">
        {{ content }}
      </div>

    </div>
  </div>
</div>

<style>
.owen-content{font-family:Georgia,"Times New Roman","Songti SC",STSong,serif;font-size:16px;line-height:1.9;color:#2a2a26}
.owen-content h1{font-size:24px;font-weight:bold;text-align:center;letter-spacing:.04em;margin:8px 0 20px;color:#1f4a3f}
.owen-content h2{font-size:17px;font-weight:bold;color:#1f4a3f;margin:26px 0 12px}
.owen-content p{margin:0 0 15px;text-align:justify}
.owen-content a{color:#1f5a4b}
.owen-content a:hover{color:#14382f}
/* 经节组列表 */
.owen-vg-list{list-style:none;padding:0;margin:26px 0;display:flex;flex-wrap:wrap;gap:10px}
.owen-vg-list li{margin:0}
.owen-vg-list a{display:inline-block;padding:8px 16px;border:1px solid #cfe0d6;border-radius:8px;
  background:#fbfaf6;color:#1f5a4b;text-decoration:none;font-size:14px;transition:all .15s}
.owen-vg-list a:hover{background:#1f5a4b;color:#fff}
</style>
