---
layout: default
---
{%- comment -%}
  博纳尔《诗篇中的基督与教会》书卷首页。配色与章节页同源（砖红 #a95c56 / #d2776f）。
  目录：序言 / 第 1–150 篇（上行之诗总论排在第 120 篇前）；末尾是文本说明与编者改动表。
{%- endcomment -%}

<div class="container bonar-wrap bonar-book" style="padding-top: 70px;">
  <div class="row">
    <div class="col-lg-9 col-lg-offset-1 col-md-10 col-md-offset-1">

      <div class="bn-booklang">
        {% if page.zh_url %}<a href="{{ site.baseurl }}{{ page.zh_url }}">中文版 &rarr;</a>{% endif %}
      </div>
      <div class="bn-hero">
        <h1>{{ page.book_name }}</h1>
        <p class="bn-hero-author">{{ page.author }}</p>
        <p class="bn-hero-meta">{{ page.edition }}</p>
      </div>

      {{ content }}

    </div>
  </div>
</div>

<style>
.bonar-book {
  --bn-ink: #d2776f;
  --bn-ink-dark: #a95c56;
  --bn-rule: #e8d6d3;
  --bn-paper: #fdfaf9;
}
.bonar-book .bn-booklang { text-align: right; margin: 0 0 10px; font-size: 13px;
  font-family: Georgia, "Times New Roman", serif; }
.bonar-book .bn-booklang a { color: var(--bn-ink-dark); border: 1px solid var(--bn-rule);
  border-radius: 4px; padding: 4px 10px; text-decoration: none; }
.bonar-book .bn-booklang a:hover { background: var(--bn-ink); color: #fff; }
/* 书首：不用大色块横幅（用户 2026-10-22），书名 + 作者 + 版本加细线 */
.bonar-book .bn-hero {
  margin: 4px 0 22px; padding: 0 0 12px; border-bottom: 2px solid var(--bn-ink);
  font-family: Georgia, "Times New Roman", "Songti SC", serif;
}
.bonar-book .bn-hero h1 { font-family: Georgia, "Times New Roman", "Songti SC", STSong, serif; margin: 0 0 4px;
  font-size: 26px; font-weight: normal; line-height: 1.3; color: var(--bn-ink-dark); }
.bonar-book .bn-hero-author { margin: 0; font-size: 14.5px; color: #3e3e44; }
.bonar-book .bn-hero-meta { margin: 2px 0 0; font-size: 13px; color: #85858f; font-style: italic; }

.bonar-book .bn-group {
  font-family: Georgia, "Times New Roman", serif; margin: 30px 0 12px;
  font-size: 15px; color: var(--bn-ink-dark); letter-spacing: .05em;
  padding-bottom: 6px; border-bottom: 1px solid var(--bn-rule);
}
.bonar-book .bn-group small { color: #9aa4ad; letter-spacing: 0; font-size: 12px; }

.bonar-book .bn-toc {
  list-style: none; padding: 0; margin: 0;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.bonar-book .bn-toc li { margin: 0; }
.bonar-book .bn-toc a {
  display: block; padding: 10px 14px; border: 1px solid var(--bn-rule);
  border-radius: 4px; background: var(--bn-paper); text-decoration: none;
  font-family: Georgia, "Times New Roman", serif; font-size: 15px;
  color: #2d3238; line-height: 1.45;
}
.bonar-book .bn-toc a:hover {
  border-color: var(--bn-ink); background: #fff; color: var(--bn-ink-dark);
}
.bonar-book .bn-toc .bn-no {
  color: var(--bn-ink); font-size: 12px; letter-spacing: .06em;
  display: block; margin-bottom: 2px;
}
.bonar-book .bn-toc .bn-ref { color: #98a2aa; font-size: 12.5px; }

.bonar-book .bn-note {
  font-family: Georgia, "Times New Roman", serif; font-size: 13.5px;
  color: #6f7982; line-height: 1.8; margin: 34px 0 0;
  padding-top: 16px; border-top: 1px solid var(--bn-rule);
}
.bonar-book .bn-toc.bn-wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.bonar-book .bn-note p { margin: 0 0 12px; }
.bonar-book .bn-note ul { margin: 0 0 12px; padding-left: 20px; }
.bonar-book .bn-ed { font-family: Georgia, "Times New Roman", serif; font-size: 13px; margin: 8px 0 0; color: #5d5856; }
.bonar-book .bn-ed summary { cursor: pointer; color: var(--bn-ink-dark); }
.bonar-book .bn-ed table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.bonar-book .bn-ed th, .bonar-book .bn-ed td { border-bottom: 1px solid var(--bn-rule); padding: 5px 6px; text-align: left; vertical-align: top; }
.bonar-book .bn-he { unicode-bidi: isolate; font-family: "SBL Hebrew", "Times New Roman", serif; }
@media (max-width: 767px) {
  .bonar-book .bn-hero h1 { font-size: 22px; }
  .bonar-book .bn-toc { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .bonar-book .bn-toc.bn-wide { grid-template-columns: 1fr; }
}
</style>
